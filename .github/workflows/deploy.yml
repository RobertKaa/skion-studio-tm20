# Deploys the Vite production build (dist/) to GitHub Pages.
#
# REQUIRED GitHub setting (Settings → Pages → Build and deployment):
#   Source = "GitHub Actions" (NOT "Deploy from a branch").
# If Pages still serves the repo-root index.html (with /src/main.tsx), branch
# deploy is active and overrides this workflow's artifact.


name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  VITE_BASE_PATH: /skion-studio-tm20/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Verify production build
        run: |
          test -f dist/index.html
          test -f dist/.nojekyll
          grep -q '/skion-studio-tm20/assets/' dist/index.html
          ! grep -q 'src/main.tsx' dist/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live site serves production build
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          echo "Deployed to: $PAGE_URL"
          for i in 1 2 3 4 5 6; do
            HTML=$(curl -fsSL "$PAGE_URL") && break
            echo "Waiting for CDN propagation (${i}/6)..."
            sleep 10
          done
          echo "$HTML" | grep -q '/skion-studio-tm20/assets/'
          ! echo "$HTML" | grep -q 'src/main.tsx'
          JS=$(echo "$HTML" | sed -n 's/.*src="\([^"]*assets\/[^"]*\.js\)".*/\1/p' | head -1)
          test -n "$JS"
          ORIGIN=$(echo "$PAGE_URL" | sed -E 's|(https?://[^/]+).*|\1|')
          curl -fsSI "${ORIGIN}${JS}" | grep -qi '200'
